site_name: vgi-rpc C++
site_description: "vgi-rpc C++: a C++20 RPC framework built on Apache Arrow IPC — unary, producer, and exchange method patterns over pipe-based transport"
site_url: https://vgi-rpc-cpp.query.farm/
repo_url: https://github.com/Query-farm/vgi-rpc-cpp
repo_name: Query-farm/vgi-rpc-cpp
copyright: "&copy; 2026 <a href=\"https://query.farm\">Query.Farm LLC</a>"

extra:
  social:
    - icon: material/web
      link: https://vgi-rpc.query.farm
      name: VGI-RPC
    - icon: material/web
      link: https://query.farm
      name: Query.Farm
    - icon: fontawesome/brands/github
      link: https://github.com/Query-farm
      name: Query.Farm on GitHub

extra_css:
  - stylesheets/extra.css

theme:
  name: material
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-sunny
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-night
        name: Switch to light mode
  features:
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.sections
    - navigation.indexes
    - navigation.top
    - navigation.footer
    - content.code.copy
    - search.highlight
    - search.suggest
    - toc.follow
  font:
    text: Inter
    code: JetBrains Mono
  custom_dir: docs/overrides
  logo: assets/logo.png
  favicon: assets/favicon.ico
  icon:
    repo: fontawesome/brands/github

markdown_extensions:
  - toc:
      permalink: true
      toc_depth: 3
  - tables
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets:
      base_path: "."
  - pymdownx.tabbed:
      alternate_style: true
  - attr_list
  - md_in_html

nav:
  - Home: index.md
  - Getting Started: getting-started.md
  - Benchmarks: benchmarks.md
  - Examples:
      - examples/index.md
      - Hello World: examples/hello-world.md
      - Calculator: examples/calculator.md
      - Streaming: examples/streaming.md
  - API Reference:
      - api/index.md
      - Server: api/server.md
      - Request: api/request.md
      - Result: api/result.md
      - Streaming: api/stream.md
      - CallContext: api/call-context.md
      - Wire Protocol: api/wire.md
      - Utilities: api/utilities.md
