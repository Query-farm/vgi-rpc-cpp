site_name: vgi-rpc C++
site_url: https://vgi-rpc-cpp.query.farm
site_description: C++20 RPC framework built on Apache Arrow IPC
repo_url: https://github.com/Query-farm/vgi-rpc-cpp
repo_name: Query-farm/vgi-rpc-cpp

theme:
  name: material
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - content.code.copy
    - navigation.sections
    - navigation.expand
    - navigation.top
    - search.highlight

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.tabbed:
      alternate_style: true
  - toc:
      permalink: true
  - attr_list

nav:
  - Home: index.md
  - Getting Started: getting-started.md
  - Examples:
      - examples/index.md
      - Hello World: examples/hello-world.md
      - Calculator: examples/calculator.md
      - Streaming: examples/streaming.md
  - API Reference:
      - api/index.md
      - Server: api/server.md
      - Request: api/request.md
      - Result: api/result.md
      - Streaming: api/stream.md
      - CallContext: api/call-context.md
      - Wire Protocol: api/wire.md
      - Utilities: api/utilities.md
