name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # Exact Rust source that defines the C ABI consumed by this SDK. Keep this
  # pinned so an unrelated Rust main-branch change cannot break C++ CI.
  VGI_RPC_IROH_RUST_REV: 9e7dfb59686682be0ff4a46183988e2724416393
  # Use Cloudflare's S3-compatible R2 endpoint directly because vcpkg binary
  # archives can exceed the Worker request-size limit. Fork PRs do not receive
  # secrets, so disable the remote cache instead of issuing broken AWS calls.
  VCPKG_BINARY_SOURCES: "${{ secrets.R2_ACCESS_KEY_ID != '' && secrets.R2_SECRET_KEY_ID != '' && secrets.R2_ENDPOINT != '' && 'clear;x-aws,s3://query-farm-duckdb-vcpkg/,readwrite' || 'clear' }}"
  AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
  AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_KEY_ID }}
  AWS_ENDPOINT_URL: ${{ secrets.R2_ENDPOINT }}
  AWS_DEFAULT_REGION: auto
  AWS_REQUEST_CHECKSUM_CALCULATION: when_required
  AWS_RESPONSE_CHECKSUM_VALIDATION: when_required

jobs:
  # Cheap and fast, and it fails the whole run before anything is built: a
  # formatting-only diff arriving on top of a real change is what the
  # formatter exists to prevent.
  format:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install clang-format
        run: pipx install 'clang-format~=22.1'
      - name: Check formatting
        run: ./scripts/format.sh --check

  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            compiler: gcc
            conformance: true
          - os: ubuntu-24.04-arm
            compiler: gcc
            conformance: true
          - os: macos-14
            compiler: apple-clang
            conformance: true

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - name: Check out version-matched native Iroh C ABI
        if: runner.os == 'Linux' && runner.arch == 'X64'
        uses: actions/checkout@v4
        with:
          repository: Query-farm/vgi-rpc-rust
          ref: ${{ env.VGI_RPC_IROH_RUST_REV }}
          path: .ci/vgi-rpc-rust

      - name: Install Rust toolchain for native Iroh
        if: runner.os == 'Linux' && runner.arch == 'X64'
        uses: dtolnay/rust-toolchain@1.97.0

      - name: Cache native Iroh build
        if: runner.os == 'Linux' && runner.arch == 'X64'
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: .ci/vgi-rpc-rust -> target
          key: cpp-native-iroh-x86_64-unknown-linux-gnu

      - name: Build and stage version-matched native Iroh
        if: runner.os == 'Linux' && runner.arch == 'X64'
        working-directory: .ci/vgi-rpc-rust
        run: |
          set -euo pipefail
          target=x86_64-unknown-linux-gnu
          cargo build --locked --release --target "$target" \
            -p vgi-iroh-cabi -p vgi-iroh-bridge
          version=$(cargo metadata --no-deps --format-version 1 \
            | jq -r '.packages[] | select(.name=="vgi-iroh-cabi") | .version')
          scripts/package-iroh-cabi.sh \
            "$target" "$version" "$VGI_RPC_IROH_RUST_REV" target release-assets
          mkdir -p ../iroh-prefix
          tar -xzf "release-assets/vgi-iroh-cabi-v${version}-${target}.tar.gz" \
            -C ../iroh-prefix
          echo "VGI_RPC_IROH_CABI_ROOT=$GITHUB_WORKSPACE/.ci/iroh-prefix/vgi-iroh-cabi-v${version}-${target}" \
            >> "$GITHUB_ENV"

      - name: Setup Python
        if: matrix.conformance
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install vgi-rpc Python reference (conformance suite)
        if: matrix.conformance
        # Clone the reference implementation and install it with the `http`
        # extra (httpx2 + zstandard for the --url HTTP client), the
        # `conformance` extra (jsonschema, for --access-log validation), and
        # `external` — the client's external-location *fetch* path imports
        # aiohttp, so without it every pointer-batch test fails on an import.
        # pytest additionally drives the shared capability-gated suite in
        # vgi_rpc.conformance._pytest_suite, which the CLI runner cannot reach.
        run: |
          git clone --depth 1 https://github.com/Query-farm/vgi-rpc-python.git ../vgi-rpc
          python -m pip install --upgrade pip
          # httpx2 2.12 stopped transparently decoding Content-Encoding while
          # retaining the decoded-response API contract used by vgi-rpc.
          # Keep cross-language CI on the reference client's known-good stack.
          python -m pip install '../vgi-rpc[http,conformance,external]' 'httpx2==2.9.1'
          python -m pip install pytest pytest-timeout

      - name: Clone and bootstrap vcpkg
        run: |
          git clone https://github.com/microsoft/vcpkg.git
          git -C vcpkg checkout 05442024c3fda64320bd25d2251cc9807b84fb6f
          ./vcpkg/bootstrap-vcpkg.sh -disableMetrics

      - name: Install newer bison (macOS)
        if: runner.os == 'macOS'
        run: |
          brew install bison
          echo "$(brew --prefix bison)/bin" >> "$GITHUB_PATH"

      # vcpkg builds libsodium through its autotools script, which needs these
      # on the box. The runners ship libtool but not autoconf/automake, and the
      # port fails at configure time with a message naming only autoconf.
      - name: Install autotools (libsodium)
        run: |
          if [ "$RUNNER_OS" = "macOS" ]; then
            brew install autoconf automake libtool
          else
            sudo apt-get update && sudo apt-get install -y autoconf automake libtool
          fi

      # vcpkg's binary cache (above) covers the dependencies; this covers our
      # own translation units, which vcpkg knows nothing about. Keyed per
      # os+compiler so the three matrix legs do not evict each other.
      - name: ccache
        uses: hendrikmuhs/ccache-action@v1.2
        with:
          key: ${{ matrix.os }}-${{ matrix.compiler }}
          max-size: 500M

      - name: Configure
        run: |
          iroh_args=()
          if [ -n "${VGI_RPC_IROH_CABI_ROOT:-}" ]; then
            iroh_args+=(
              -DVGI_RPC_WITH_IROH_CABI=ON
              -DVGI_RPC_IROH_CABI_ROOT="$VGI_RPC_IROH_CABI_ROOT"
            )
          fi
          cmake --preset default \
            -DCMAKE_C_COMPILER_LAUNCHER=ccache \
            -DCMAKE_CXX_COMPILER_LAUNCHER=ccache \
            "${iroh_args[@]}"

      - name: Build
        # Hosted Linux runners repeatedly terminated while more than fifteen
        # Arrow-linked executables reached the linker together. Keep complete
        # target coverage, but bound Linux compiler/linker fan-out according
        # to the runner size; macOS retains its native parallelism.
        run: |
          if [ "$RUNNER_ARCH" = "ARM64" ]; then
            cmake --build --preset default --parallel 2
          elif [ "$RUNNER_OS" = "Linux" ]; then
            cmake --build --preset default --parallel 4
          else
            cmake --build --preset default --parallel
          fi

      - name: Test (unit)
        run: ctest --test-dir build --output-on-failure -E conformance

      # Cross-port drift. Everything above establishes that this port agrees
      # with itself and with the spec as this repository reads it; nothing
      # above compares it to another implementation. These two tools do, and
      # between them they have caught ports describing a protocol as having
      # zero methods, six ports logging six different wrong protocol hashes,
      # and a client sending bare paths — none of it visible from inside any
      # single port.
      #
      # The reference is cloned from `main`, unpinned, by the install step
      # above. That is deliberate: a pinned reference is how a lane rots for
      # weeks while reporting green. A reference change that breaks this port
      # is meant to turn this port red the day it lands.
      #
      # One leg only. The comparison is over protocol *shape* and over source
      # text, neither of which varies by OS or architecture, so running it on
      # all three legs would buy nothing and pay three times.
      - name: Cross-port drift vs the Python reference
        if: matrix.conformance && runner.os == 'Linux' && runner.arch == 'X64'
        env:
          VGI_RPC_REPOS: ${{ runner.temp }}/cross-port
        run: |
          set -euo pipefail
          # Both tools resolve a port as <repos>/vgi-rpc-<dirname>, and both
          # spell this port `vgi-rpc-c++` (describe_diff.SUBPROCESS_WORKERS,
          # identity_consistency.PORTS). The GitHub checkout is `vgi-rpc-cpp`
          # and the reference clone landed at `../vgi-rpc`, so assemble the
          # layout the tools expect out of symlinks instead of re-cloning
          # either repository — re-cloning the reference here would also
          # reintroduce the risk of the two copies drifting apart mid-run.
          mkdir -p "$VGI_RPC_REPOS"
          reference="$(cd "$GITHUB_WORKSPACE/../vgi-rpc" && pwd)"
          ln -sfn "$GITHUB_WORKSPACE" "$VGI_RPC_REPOS/vgi-rpc-c++"
          ln -sfn "$reference" "$VGI_RPC_REPOS/vgi-rpc-python"

          # describe_diff spawns build/conformance/conformance_worker (already
          # built above; its `build` step is a no-op rebuild) and compares
          # every protocol it hosts, by hash, against the in-process Python
          # server. identity_consistency greps this port's sources for the
          # Identity.v1 invariants. Both exit non-zero on disagreement, and
          # `set -e` carries that out of the step.
          #
          # --verbose on the second one is not noise. It is a source-level
          # grep: with the layout above even slightly wrong it would have
          # nothing to read, and a passing exit code and a real audit are
          # different claims. --verbose makes the log name this port and the
          # files it actually opened, so the difference is visible.
          cd "$reference"
          python tools/cross-port/describe_diff.py --only cpp
          python tools/cross-port/identity_consistency.py --only cpp --verbose

      - name: Test native HTTP-over-Iroh end to end (direct, no relay)
        if: runner.os == 'Linux' && runner.arch == 'X64'
        run: |
          set -euo pipefail
          worker_log="$RUNNER_TEMP/vgi-http-worker.log"
          bridge_log="$RUNNER_TEMP/vgi-iroh-bridge.log"
          worker_pid=
          bridge_pid=
          cleanup() {
            if [ -n "$bridge_pid" ]; then kill "$bridge_pid" 2>/dev/null || true; fi
            if [ -n "$worker_pid" ]; then kill "$worker_pid" 2>/dev/null || true; fi
          }
          trap cleanup EXIT

          PYTHONPATH="$GITHUB_WORKSPACE/../vgi-rpc" \
            python ../vgi-rpc/tests/serve_fixture_describe_http.py >"$worker_log" 2>&1 &
          worker_pid=$!
          for _ in $(seq 1 30); do
            grep -q '^PORT:' "$worker_log" && break
            kill -0 "$worker_pid" 2>/dev/null || break
            sleep 1
          done
          port=$(sed -n 's/^PORT://p' "$worker_log" | head -n 1)
          if [ -z "$port" ]; then cat "$worker_log"; exit 1; fi

          .ci/vgi-rpc-rust/target/x86_64-unknown-linux-gnu/release/vgi-iroh-bridge \
            --ephemeral --no-relay --print-direct-addresses \
            --http-upstream "http://127.0.0.1:$port" >"$bridge_log" 2>&1 &
          bridge_pid=$!
          for _ in $(seq 1 30); do
            grep -q '^DIRECT:' "$bridge_log" && break
            kill -0 "$bridge_pid" 2>/dev/null || break
            sleep 1
          done
          endpoint=$(grep -m1 -E '^[0-9a-f]{64}$' "$bridge_log" || true)
          direct_addresses=$(sed -n 's/^DIRECT://p' "$bridge_log" | paste -sd, -)
          if [ -z "$endpoint" ] || [ -z "$direct_addresses" ]; then cat "$bridge_log"; exit 1; fi

          VGI_RPC_IROH_HTTP_TEST_ENDPOINT="$endpoint" \
          VGI_RPC_IROH_HTTP_TEST_DIRECT_ADDRESSES="$direct_addresses" \
            ctest --test-dir build --output-on-failure \
              -R 'native C ABI connects to a live HTTP-over-Iroh worker$'

      # Both HTTP wire codecs are mandatory for this port. Keep this focused
      # failure ahead of the full matrix so a missing zlib feature or a codec
      # negotiation regression names itself directly.
      - name: Test (mandatory zstd + gzip HTTP codecs)
        if: matrix.conformance
        env:
          VGI_RPC_CPP_WORKER: ${{ github.workspace }}/build/conformance/conformance_worker
        run: >
          python -m pytest tests/conformance/test_suite.py -q -p no:randomly
          -k 'HttpCompressionNegotiation or CompressedHttpRequestCap'

      - name: Validate install
        if: runner.os == 'Linux'
        run: |
          cmake --install build --prefix ${{ runner.temp }}/install
          iroh_args=()
          if [ -n "${VGI_RPC_IROH_CABI_ROOT:-}" ]; then
            iroh_args+=("-DVGI_RPC_IROH_CABI_ROOT=$VGI_RPC_IROH_CABI_ROOT")
          fi
          cmake -S tests/install_test -B ${{ runner.temp }}/install_test_build \
            -DCMAKE_PREFIX_PATH="${{ runner.temp }}/install;$(pwd)/build/vcpkg_installed/${{ runner.arch == 'ARM64' && 'arm64' || 'x64' }}-linux" \
            "${iroh_args[@]}"
          cmake --build ${{ runner.temp }}/install_test_build

      - name: Test (conformance — pipe, unix, tcp, HTTP, access-log, pytest suite)
        if: matrix.conformance
        # Runs both official cross-language suites against the C++ worker over
        # every transport it supports (see scripts/run_conformance.sh): the
        # `vgi-rpc-test` CLI runner, and the shared pytest suite that covers
        # the capability-gated HTTP groups.
        env:
          CONFORMANCE_WORKER: ${{ github.workspace }}/build/conformance/conformance_worker
        run: ./scripts/run_conformance.sh

      # Everything above drives this port's *server* with the reference
      # client. The two steps below reverse that and drive this port's
      # *client*, through the JSONL driver in
      # conformance/conformance_client_driver.cpp.
      #
      # This is the half nothing else covers. The client had shipped calling
      # the retired `__describe__`, sending no `vgi_rpc.protocol` routing key,
      # and posting flat rather than namespaced HTTP paths; three C++-only
      # suites reported green throughout, because a server accommodates the
      # client it ships with and neither half can see the accommodation. The
      # Rust port's client sent bare paths for weeks on exactly that basis and
      # produced 730 failures the first time it met the reference.
      #
      # Both legs on every OS, unlike the protocol-shape drift check above:
      # what is under test here is transport code — subprocess spawn, AF_UNIX,
      # TCP, HTTP keep-alive — and that is precisely what varies by platform.
      - name: Test (client role — this port's client vs the Python reference server)
        if: matrix.conformance
        # The gate. A conforming client passes the conformance suite against
        # the reference server; a run against our own server cannot establish
        # that, however green.
        env:
          VGI_CONFORMANCE_ROLE: client
          VGI_CONFORMANCE_SERVER: python
          VGI_CLIENT_DRIVER: ${{ github.workspace }}/build/conformance/conformance_client_driver
          VGI_RPC_PYTHON_REPO: ${{ github.workspace }}/../vgi-rpc
        run: python -m pytest tests/conformance/test_suite.py -q -p no:randomly

      - name: Test (client role — this port's client vs this port's server)
        if: matrix.conformance
        # Not the gate: a regression check, and a triage aid. When the step
        # above goes red, the gap between the two runs localises the defect to
        # one side in a single comparison.
        env:
          VGI_CONFORMANCE_ROLE: client
          VGI_CONFORMANCE_SERVER: cpp
          VGI_CLIENT_DRIVER: ${{ github.workspace }}/build/conformance/conformance_client_driver
          VGI_RPC_CPP_WORKER: ${{ github.workspace }}/build/conformance/conformance_worker
        run: python -m pytest tests/conformance/test_suite.py -q -p no:randomly
