name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  VCPKG_BINARY_SOURCES: "clear;x-aws,s3://query-farm-duckdb-vcpkg/,readwrite"
  AWS_ACCESS_KEY_ID: ${{ secrets.VCPKG_CACHING_AWS_ACCESS_KEY_ID }}
  AWS_SECRET_ACCESS_KEY: ${{ secrets.VCPKG_CACHING_AWS_SECRET_ACCESS_KEY }}
  AWS_ENDPOINT_URL: ${{ secrets.VCPKG_CACHING_AWS_ENDPOINT_URL }}
  AWS_DEFAULT_REGION: ${{ secrets.VCPKG_CACHING_AWS_DEFAULT_REGION }}
  AWS_REQUEST_CHECKSUM_CALCULATION: when_required

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            compiler: gcc
            conformance: true
          - os: ubuntu-24.04-arm
            compiler: gcc
            conformance: true
          - os: macos-14
            compiler: apple-clang
            conformance: true

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        if: matrix.conformance
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install vgi-rpc Python reference (conformance suite)
        if: matrix.conformance
        # Clone the reference implementation and install it with the `http`
        # extra (httpx2 + zstandard for the --url HTTP client), the
        # `conformance` extra (jsonschema, for --access-log validation), and
        # `external` — the client's external-location *fetch* path imports
        # aiohttp, so without it every pointer-batch test fails on an import.
        # pytest additionally drives the shared capability-gated suite in
        # vgi_rpc.conformance._pytest_suite, which the CLI runner cannot reach.
        run: |
          git clone --depth 1 https://github.com/Query-farm/vgi-rpc-python.git ../vgi-rpc
          python -m pip install --upgrade pip
          python -m pip install '../vgi-rpc[http,conformance,external]'
          python -m pip install pytest pytest-timeout

      - name: Clone and bootstrap vcpkg
        run: |
          git clone https://github.com/microsoft/vcpkg.git
          git -C vcpkg checkout 05442024c3fda64320bd25d2251cc9807b84fb6f
          ./vcpkg/bootstrap-vcpkg.sh -disableMetrics

      - name: Install newer bison (macOS)
        if: runner.os == 'macOS'
        run: |
          brew install bison
          echo "$(brew --prefix bison)/bin" >> $GITHUB_PATH

      # vcpkg's binary cache (above) covers the dependencies; this covers our
      # own translation units, which vcpkg knows nothing about. Keyed per
      # os+compiler so the three matrix legs do not evict each other.
      - name: ccache
        uses: hendrikmuhs/ccache-action@v1.2
        with:
          key: ${{ matrix.os }}-${{ matrix.compiler }}
          max-size: 500M

      - name: Configure
        run: >
          cmake --preset default
          -DCMAKE_C_COMPILER_LAUNCHER=ccache
          -DCMAKE_CXX_COMPILER_LAUNCHER=ccache

      - name: Build
        run: cmake --build --preset default --parallel

      - name: Test (unit)
        run: ctest --test-dir build --output-on-failure -E conformance

      - name: Validate install
        if: runner.os == 'Linux'
        run: |
          cmake --install build --prefix ${{ runner.temp }}/install
          cmake -S tests/install_test -B ${{ runner.temp }}/install_test_build \
            -DCMAKE_PREFIX_PATH="${{ runner.temp }}/install;$(pwd)/build/vcpkg_installed/${{ runner.arch == 'ARM64' && 'arm64' || 'x64' }}-linux"
          cmake --build ${{ runner.temp }}/install_test_build

      - name: Test (conformance — pipe, unix, tcp, HTTP, access-log, pytest suite)
        if: matrix.conformance
        # Runs both official cross-language suites against the C++ worker over
        # every transport it supports (see scripts/run_conformance.sh): the
        # `vgi-rpc-test` CLI runner, and the shared pytest suite that covers
        # the capability-gated HTTP groups.
        env:
          CONFORMANCE_WORKER: ${{ github.workspace }}/build/conformance/conformance_worker
        run: ./scripts/run_conformance.sh
